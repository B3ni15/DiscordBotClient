name: discordbotclient

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Used when no Cloudflare D1 credentials are present; the file is kept on
      # the app-data volume so accounts and the vault survive a rebuild.
      DATABASE_URL: ${DATABASE_URL:-file:/data/disbotclient.db}
    ports:
      - "${APP_PORT:-6766}:3000"
    volumes:
      - app-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8787"
      # Set BRIDGE_SECRET in .env. Without it the bridge generates a new secret
      # on every start and prints it in its log.
      BRIDGE_SECRET: ${BRIDGE_SECRET:-}
    ports:
      - "${BRIDGE_HOST_PORT:-6768}:8787"

  # Polls the git branch and redeploys on new commits. Remove this service (and
  # the docker socket mount) if you would rather deploy by hand.
  updater:
    build:
      context: .
      dockerfile: Dockerfile.updater
    restart: unless-stopped
    environment:
      APP_DIR: ${HOST_PROJECT_DIR:?Set HOST_PROJECT_DIR in .env to this repository's path on the host}
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:?Set HOST_PROJECT_DIR in .env to this repository's path on the host}
      GIT_BRANCH: ${GIT_BRANCH:-master}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-300}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-discordbotclient}
    volumes:
      - ${HOST_PROJECT_DIR:?Set HOST_PROJECT_DIR in .env to this repository's path on the host}:${HOST_PROJECT_DIR:?Set HOST_PROJECT_DIR in .env to this repository's path on the host}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${HOST_PROJECT_DIR:?Set HOST_PROJECT_DIR in .env to this repository's path on the host}

volumes:
  app-data:
